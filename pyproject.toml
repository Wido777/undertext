[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "undertext"
version = "0.4.1"
description = "Detect instructions aimed at AI hidden in assistant links (\"Summarize with AI\" buttons) and in web page content."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
authors = [{ name = "Wido777" }]
keywords = ["security", "prompt-injection", "llm", "memory-poisoning", "ai-security"]

[project.urls]
Homepage = "https://github.com/Wido777/undertext"

[project.scripts]
undertext = "undertext.cli:main"

[tool.setuptools]
packages = ["undertext"]
